name: Sync upstream.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: tgymnich/fork-sync@e905b254d56ebb367514cd05fa96bf7516bd2a5a # v2.0.10
        with:
          owner: telegramdesktop
          base: dev
          head: dev

      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Bump Telegram/ThirdParty/td to futpib/td:master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TD_SHA=$(gh api repos/futpib/td/branches/master --jq '.commit.sha')
          CURRENT=$(git ls-tree HEAD Telegram/ThirdParty/td | awk '{print $3}')
          if [ "$TD_SHA" != "$CURRENT" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git update-index --cacheinfo "160000,$TD_SHA,Telegram/ThirdParty/td"
            git commit -m "Bump Telegram/ThirdParty/td to $TD_SHA"
            git push origin dev
          fi

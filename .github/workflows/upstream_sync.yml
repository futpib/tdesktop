name: Sync upstream.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Add upstream remote
        run: git remote add upstream https://github.com/telegramdesktop/tdesktop.git

      - name: Fetch upstream
        run: git fetch upstream dev

      - name: Attempt merge
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git merge upstream/dev --no-edit; then
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse @{u})" ]; then
              echo "result=noop" >> "$GITHUB_OUTPUT"
            else
              echo "result=success" >> "$GITHUB_OUTPUT"
            fi
          else
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Push merged changes
        if: steps.merge.outputs.result == 'success'
        run: git push origin dev

      - name: Create conflict resolution branch and PR
        if: steps.merge.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list --label "upstream-sync" --state open --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "Upstream sync PR already exists, skipping."
            exit 0
          fi

          branch="upstream-sync/$(date +%Y-%m-%d)"
          git checkout -b "$branch"
          git merge upstream/dev --no-edit || true
          git add -A
          git commit --no-edit -m "WIP: merge upstream/dev (has conflicts)"
          git push origin "$branch"

          gh pr create \
            --base dev \
            --head "$branch" \
            --title "Upstream sync conflict ($(date +%Y-%m-%d))" \
            --label "upstream-sync" \
            --body "Automatic merge of \`upstream/dev\` into \`dev\` failed due to conflicts.

          The conflict markers are committed on this branch. To resolve:
          \`\`\`
          git fetch origin $branch
          git checkout $branch
          git reset HEAD~1
          git checkout dev
          git merge upstream/dev
          # fix conflicts
          git push origin dev
          \`\`\`"
